# This workflow verifies that the Docker image builds and can run the validator.

name: Docker Smoke

on:
  push:
    branches-ignore: [ main ]
  pull_request:
  workflow_call:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Build Docker image
      run: docker build -t rsmp-validator:smoke .

    - name: Check CLI help
      run: docker run --rm rsmp-validator:smoke --help

    - name: Check external-system defaults
      run: |
        docker run --rm --entrypoint ruby rsmp-validator:smoke \
          -ryaml -e 'config = YAML.load_file("config/validator.yaml"); abort "auto node enabled" if config.key?("auto_site") || config.key?("auto_supervisor")'

    - name: Run validator tests
      run: |
        docker run --rm --entrypoint bundle \
          rsmp-validator:smoke \
          exec sus test/validator

    - name: Run Core 3.1.5 validator smoke test
      run: |
        docker run --rm \
          rsmp-validator:smoke \
          run test/site/core/connect_spec.rb --verbose \
          --site-config config/gem_tlc.yaml \
          --auto-site-config config/simulator/tlc.yaml \
          --core 3.1.5

    - name: Run Core 3.2.2 validator smoke test
      run: |
        docker run --rm \
          rsmp-validator:smoke \
          run test/site/core/connect_spec.rb --verbose \
          --site-config config/gem_tlc.yaml \
          --auto-site-config config/simulator/tlc.yaml \
          --core 3.2.2

    - name: Run Core 3.3.0 validator smoke test
      run: |
        docker run --rm \
          rsmp-validator:smoke \
          run test/site/core/connect_spec.rb --verbose \
          --site-config config/gem_tlc.yaml \
          --auto-site-config config/simulator/tlc.yaml \
          --core 3.3.0
