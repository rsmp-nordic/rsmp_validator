# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will run rsmp validator
name: Swarco ITC-3
on:
  pull_request:
    types: [ opened, reopened, synchronize, labeled ]
  schedule:
    # Schedules run on the default branch, at 22:00 UTC.
    - cron: '0 22 * * 0-4' # Curated: Sunday–Thursday.
jobs:
  validator:
    if: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'testhub') }}
    runs-on: [ self-hosted, Linux, X64, itc3 ]
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Every SXL on the latest supported Core.
          - { core: '3.2.2', sxl: '1.2.1' }
          - { core: '3.2.2', sxl: '1.2.0' }
          - { core: '3.2.2', sxl: '1.1.0' }
          - { core: '3.2.2', sxl: '1.0.15' }
          - { core: '3.2.2', sxl: '1.0.14' }
          - { core: '3.2.2', sxl: '1.0.13' }
          - { core: '3.2.2', sxl: '1.0.10' }
          - { core: '3.2.2', sxl: '1.0.9' }
          - { core: '3.2.2', sxl: '1.0.8' }
          - { core: '3.2.2', sxl: '1.0.7' }
          # Historical pairs cover the older Core versions.
          - { core: '3.2.1', sxl: '1.2.0' }
          - { core: '3.2.0', sxl: '1.1.0' }
          - { core: '3.1.5', sxl: '1.0.15' }
          - { core: '3.1.4', sxl: '1.0.14' }
          - { core: '3.1.3', sxl: '1.0.13' }
          - { core: '3.1.2', sxl: '1.0.7' }
      fail-fast: false
      max-parallel: 1

    steps:
    - name: Set log id
      shell: bash
      id: log_id
      run: |
        echo "LOG_ID=\
        swarco-itc3-\
        core-${{ matrix.core }}-sxl-${{ matrix.sxl }}-\
        run-\
        ${{ github.run_id }}-\
        ${{ github.run_number }}-\
        ${{ github.run_attempt }}\
        " >> $GITHUB_OUTPUT

    - name: Check out repository
      uses: actions/checkout@v6

    - name: Install Ruby and gems
      id: ruby_setup
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Run tests
      shell: bash
      run: |
        bundle exec rsmp-validator run test/site \
        --verbose --log-path validator-${{ steps.log_id.outputs.LOG_ID }}.log \
        --report-json compliance-${{ steps.log_id.outputs.LOG_ID }}.json \
        --site-config config/sites/swarco_itc3.yaml \
        --core ${{ matrix.core }} --sxls tlc:${{ matrix.sxl }}

    - name: Show detailed log
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      shell: bash
      run: cat validator-${{ steps.log_id.outputs.LOG_ID }}.log

    - name: Upload validator.log
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: validator-${{ steps.log_id.outputs.LOG_ID }}.log
        path: validator-${{ steps.log_id.outputs.LOG_ID }}.log

    - name: Upload compliance result
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: compliance-${{ steps.log_id.outputs.LOG_ID }}.json
        path: compliance-${{ steps.log_id.outputs.LOG_ID }}.json
        if-no-files-found: warn
