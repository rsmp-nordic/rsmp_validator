# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will run rsmp validator
name: Gem TLC
on:
  pull_request:
    types: [ opened, reopened, synchronize ]
jobs:
  validate_core_sxl:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Every SXL on the latest supported Core.
          - { core: '3.3.0', sxl: '1.2.1' }
          - { core: '3.3.0', sxl: '1.2.0' }
          - { core: '3.3.0', sxl: '1.1.0' }
          - { core: '3.3.0', sxl: '1.0.15' }
          - { core: '3.3.0', sxl: '1.0.14' }
          - { core: '3.3.0', sxl: '1.0.13' }
          - { core: '3.3.0', sxl: '1.0.10' }
          - { core: '3.3.0', sxl: '1.0.9' }
          - { core: '3.3.0', sxl: '1.0.8' }
          - { core: '3.3.0', sxl: '1.0.7' }
          # Historical pairs cover the older Core versions.
          - { core: '3.2.2', sxl: '1.2.1' }
          - { core: '3.2.1', sxl: '1.2.0' }
          - { core: '3.2.0', sxl: '1.1.0' }
          - { core: '3.1.5', sxl: '1.0.15' }
          - { core: '3.1.4', sxl: '1.0.14' }
          - { core: '3.1.3', sxl: '1.0.13' }
          - { core: '3.1.2', sxl: '1.0.7' }
      fail-fast: false

    steps:
    - name: Set log id
      shell: bash
      id: log_id
      run: |
        echo "LOG_ID=\
        gem-tlc-ubuntu-latest-\
        core-${{ matrix.core }}-sxl-${{ matrix.sxl }}-\
        run-\
        ${{ github.run_id }}-\
        ${{ github.run_number }}-\
        ${{ github.run_attempt }}\
        " >> $GITHUB_OUTPUT

    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Install Ruby and gems
      id: ruby_setup
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        cache-version: 2

    - name: Start TLC in background
      shell: bash
      run: |
        bundle exec rsmp site --config config/simulator/tlc.yaml \
        --core ${{ matrix.core }} --sxls tlc:${{ matrix.sxl }} \
        > simulator-${{ steps.log_id.outputs.LOG_ID }}.log 2>&1 \
        &

    - name: Run tests
      shell: bash
      run: |
        bundle exec rsmp-validator run test/site \
        --verbose --log-path validator-${{ steps.log_id.outputs.LOG_ID }}.log \
        --report-json compliance-${{ steps.log_id.outputs.LOG_ID }}.json \
        --site-config config/sites/gem_tlc.yaml \
        --core ${{ matrix.core }} --sxls tlc:${{ matrix.sxl }}

    - name: Show detailed log
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      shell: bash
      run: cat validator-${{ steps.log_id.outputs.LOG_ID }}.log

    - name: Upload validator.log
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: validator-${{ steps.log_id.outputs.LOG_ID }}.log
        path: validator-${{ steps.log_id.outputs.LOG_ID }}.log

    - name: Upload simulator.log
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: simulator-${{ steps.log_id.outputs.LOG_ID }}.log
        path: simulator-${{ steps.log_id.outputs.LOG_ID }}.log

    - name: Upload compliance result
      if: ${{ always() && steps.ruby_setup.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: compliance-${{ steps.log_id.outputs.LOG_ID }}.json
        path: compliance-${{ steps.log_id.outputs.LOG_ID }}.json
        if-no-files-found: warn
